name: phase-9-11-quality
on:
  pull_request:
    paths:
      - 'apps/ladipage-backend/**'
      - 'libs/**'
      - 'scripts/security/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/security/phase-0-3-guard.js
      - run: node scripts/security/phase-4-6-guard.js
      - run: node scripts/security/phase-7-8-guard.js
      - run: node scripts/security/phase-9-11-guard.js
      - run: pnpm nx build ladipage-backend
      - run: pnpm nx build-worker ladipage-backend
