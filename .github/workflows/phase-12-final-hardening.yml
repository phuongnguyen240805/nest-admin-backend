name: phase-12-final-hardening

on:
  pull_request:
    paths:
      - 'apps/ladipage-backend/**'
      - 'libs/**'
      - 'scripts/security/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Phase 0-3 security guard
        run: node scripts/security/phase-0-3-guard.js
      - name: Phase 4-6 security guard
        run: node scripts/security/phase-4-6-guard.js
      - name: Phase 7-8 security guard
        run: node scripts/security/phase-7-8-guard.js
      - name: Phase 9-11 quality guard
        run: node scripts/security/phase-9-11-guard.js
      - name: Phase 12 final hardening guard
        run: node scripts/security/phase-12-final-hardening-guard.js
      - name: Build backend
        run: pnpm nx build ladipage-backend
      - name: Build worker
        run: pnpm nx build-worker ladipage-backend
